name: Public safety checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-boundary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project boundary
        shell: pwsh
        run: ./scripts/validate_project.ps1
      - name: Scan public release
        shell: pwsh
        run: ./scripts/scan_public_release.ps1

  website:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static website
        shell: pwsh
        run: ./scripts/validate_static_site.ps1
